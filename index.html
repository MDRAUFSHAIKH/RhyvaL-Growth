    <style>
      html {
        scroll-padding-top: 80px; /* Offset for sticky navbar */
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0B0B0B;
        color: #FFFFFF;
        overflow-x: hidden;
      }
      .neon-glow {
        box-shadow: 0 0 15px rgba(163, 64, 255, 0.4);
      }
      .neon-text {
        color: #A340FF;
        text-shadow: 0 0 10px rgba(163, 64, 255, 0.5);
      }
      .bg-neon {
        background-color: #A340FF;
      }
      .text-gradient {
        background: linear-gradient(135deg, #A340FF 0%, #D191FF 50%, #A340FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: shine 4s linear infinite;
      }
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }
      @keyframes slideInDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-down {
        animation: slideInDown 0.3s ease-out forwards;
      }
    </style>
